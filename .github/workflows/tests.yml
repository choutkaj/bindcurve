name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync lint dependencies
        run: uv sync --group lint --frozen

      - name: Run Ruff
        run: uv run --frozen ruff check bindcurve tests

      - name: Check formatting
        run: uv run --frozen ruff format --check bindcurve tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync test dependencies
        run: uv sync --group test --frozen

      - name: Run tests
        run: uv run --frozen pytest

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build distributions
        run: uv build

      - name: Smoke test built wheel
        run: |
          uv venv .venv-smoke
          uv pip install --python .venv-smoke/bin/python dist/*.whl
          .venv-smoke/bin/python -c "import bindcurve; print(bindcurve.__version__)"

      - name: Test source distribution against the installed wheel
        run: |
          uv pip install --python .venv-smoke/bin/python pytest
          .venv-smoke/bin/python -c "import pathlib, tarfile; tarfile.open(next(pathlib.Path('dist').glob('*.tar.gz'))).extractall('dist/sdist-check', filter='data')"
          source_dir=$(find dist/sdist-check -mindepth 1 -maxdepth 1 -type d)
          .venv-smoke/bin/python -I -m pytest --import-mode=importlib "$source_dir/tests"
